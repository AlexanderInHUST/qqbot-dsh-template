; 沙箱进程表。以非 root 用户运行，所以 pid/socket/日志都放在 /tmp。
[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:fluxbox]
command=/usr/bin/fluxbox
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/null
redirect_stderr=true

; x11vnc 只监听容器内回环，外面只能通过 noVNC（6080）看
[program:x11vnc]
command=/usr/local/bin/start-vnc.sh
priority=30
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 127.0.0.1:5900
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; 第二块屏 :100，给聊天用的浏览器（8933）。以前它是无头的，你在 noVNC 里看不到她在群里/私聊里帮人查东西时开了什么；
; 现在在 http://127.0.0.1:6082/vnc.html 看（玩的那块还是 6080）。
[program:xvfb-chat]
command=/usr/bin/Xvfb :100 -screen 0 %(ENV_SCREEN_WIDTH)sx%(ENV_SCREEN_HEIGHT)sx24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:fluxbox-chat]
command=/usr/bin/fluxbox
environment=DISPLAY=":100"
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/null
redirect_stderr=true

[program:x11vnc-chat]
command=/usr/local/bin/start-vnc.sh :100 5901
priority=30
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc-chat]
command=/usr/bin/websockify --web /usr/share/novnc 6082 127.0.0.1:5901
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; 浏览器：有界面模式跑在 Xvfb 上，你在 noVNC 里能看到 AI 在干什么。
; 浏览器资料（cookie、登录态）存在 /var/lib/sandbox-browser，那是一个数据卷，重启后还在。
; 你在 noVNC 里帮它登录的账号（比如 B 站）会一直保持；所有流量走 egress-proxy。
; --shared-browser-context：所有 DSH 会话（私聊、各个群）共用这一个浏览器。持久资料目录同一时间只能被一个浏览器打开，
;   不共享的话第一个会话占住之后，其他会话会报 "Browser is already in use"。
; --idle-timeout：3 分钟没人用就关掉浏览器（停掉 B 站自动连播、省内存），下次调用自动重开，登录态不丢。
; --caps vision：多出按坐标操作鼠标的工具（browser_mouse_drag_xy / click_xy / move_xy / down / up / wheel）。
;   browser_drag 按元素拖，落点被拖着走的东西挡住就一直等到超时，鼠标还停在按下状态，网页小游戏里基本拖不动；
;   按截图坐标拖不做这些检查（2026-10-22 在 Infinite Craft 上试过：Water 拖到 Fire 上合出了 Steam）。
; 渲染进程个数、站点隔离都用 Chromium 默认的（sandbox 容器不限线程和内存，用不着压）。
[program:playwright-mcp]
command=/usr/local/bin/playwright-mcp --browser chromium --no-sandbox --caps vision --host 0.0.0.0 --port 8931 --allowed-hosts * --user-data-dir /var/lib/sandbox-browser/profile --shared-browser-context --idle-timeout 180000 --proxy-server http://egress-proxy:3128 --output-dir /tmp/pw-out --output-max-size 104857600
priority=50
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; qqbot_agent：聊天用的第二个浏览器（单独的资料目录、不登录任何账号）。玩的那个只给自由时间会话用，
; 两边各开各的页面，聊天时帮人查东西不会把正在看的视频挤掉。
; 有界面模式跑在第二块屏 :100 上（noVNC 6082 能看）；2026-10-22 前是 --headless，看不到，neal.fun 这类站还会被 Cloudflare 拦。
[program:playwright-mcp-chat]
command=/usr/local/bin/playwright-mcp --browser chromium --no-sandbox --host 0.0.0.0 --port 8933 --allowed-hosts * --user-data-dir /var/lib/sandbox-browser/chat-profile --shared-browser-context --idle-timeout 180000 --proxy-server http://egress-proxy:3128 --output-dir /tmp/pw-out-chat --output-max-size 104857600
environment=DISPLAY=":100"
priority=50
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:desktop-mcp]
command=/opt/desktop-mcp/venv/bin/python -I /opt/desktop-mcp/desktop_mcp.py
priority=50
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
