# 沙箱唯一的出网口：只放行公网 80/443，拒绝一切内网、回环、链路本地地址。
# 沙箱容器本身只在 internal 网络里，绕不过这个代理直连外网。

http_port 3128

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

# 内网和特殊地址：控制面容器、宿主机、云厂商元数据（169.254.169.254）都在这里面
acl blocked_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl blocked_dst dst ::1 fc00::/7 fe80::/10

# 只接受来自沙箱网络的请求（与 docker-compose.yml 里 sandbox-net 的网段一致）
acl sandbox_src src 172.31.250.0/24

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked_dst

# 广告竞价、跨站同步的域名：拦掉以后网页和游戏照常，只是没有广告位、少等片头广告，页面也轻一些。
# 除了下面 owner_blocked 里主人点名的，网站本身不拦（2026-10-23 前还拦着 play2048.co，那是 sandbox 线程数有上限时它会把浏览器拖崩）
acl ad_hosts dstdomain .doubleclick.net .googlesyndication.com .googletagservices.com .googleadservices.com .adtrafficquality.google
acl ad_hosts dstdomain .amazon-adsystem.com .adkernel.com .unrulymedia.com .rubiconproject.com .smartadserver.com .ay.delivery
acl ad_hosts dstdomain .adsafeprotected.com .admanmedia.com .yieldmo.com .criteo.com .criteo.net .everesttech.net .openx.net
acl ad_hosts dstdomain .a-mo.net .onetag-sys.com .adsrvr.org .casalemedia.com .bidswitch.net .loopme.me .pubmatic.com .3lift.com
acl ad_hosts dstdomain .inmobi.com .1rx.io .richaudience.com .media.net .tapad.com .indexww.com .id5-sync.com .omnitagjs.com
acl ad_hosts dstdomain .adnxs.com .taboola.com .outbrain.com .teads.tv .sharethrough.com .smaato.net .lijit.com .sonobi.com
acl ad_hosts dstdomain .contextweb.com .adform.net .serving-sys.com .moatads.com .pubnation.com .adx.opera.com .oa.opera.com
acl ad_hosts dstdomain .33across.com .gumgum.com .sovrn.com .triplelift.com .districtm.io .yieldlab.net .seedtag.com .minutemedia-prebid.com
http_access deny ad_hosts
# 主人不让她看的网站（2026-10-23：“别让她看 ptt”）。web_fetch 不走这个代理，在 mcp-web-search-safe.js 里另外拦
acl owner_blocked dstdomain .ptt.cc
http_access deny owner_blocked

http_access allow sandbox_src
http_access deny all

# 不缓存、不记录请求正文；访问日志留着方便你审计 AI 去了哪些网站
cache deny all
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename /var/run/squid/squid.pid
coredump_dir /var/spool/squid
forwarded_for delete
via off
# 说明：dst 类 ACL 判断的是 squid 自己解析出来的 IP，所以域名解析到内网（DNS rebinding）同样会被拒
